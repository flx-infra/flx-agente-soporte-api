# ---------------------------------------------------------------------------
# Asistente de Soporte API de Flexxus (sin dominio por ahora)
#
# Codigo e imagen: bitbucket.org/flexxus_id/flx-agente-soporte-api
# Este repo es solo el stack: lo que Portainer despliega.
#
# Sin dominio: publica un puerto en la red interna (http://<ip del swarm>:${PORT_PUBLICO}).
# Cuando tenga dominio, se agregan las labels de Traefik como en los otros stacks.
#
# Variables del stack: SERVICE_NAME, NODE, LOKI_URL, PORT_PUBLICO, DATA_VOLUME,
# APP_USER, APP_PASSWORD, MCP_TOKEN,
# MEMORIA_URL (http://flx-mcp-memoria_mcp:8100/mcp, por la red flx-agentes), MEMORIA_LEER y
# HELPDESK_MCP_URL (http://flx-mcp-helpdesk_mcp:8101/mcp).
# ---------------------------------------------------------------------------
version: '3.6'

services:
  web:
    image: fabreguesm/flx-agente-soporte-api:2.3.0
    hostname: flx-agente-soporte-api
    ports:
      - target: 3000
        published: ${PORT_PUBLICO}
        protocol: tcp
        mode: ingress
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - HELPDESK_EMAIL=${HELPDESK_EMAIL}
      - HELPDESK_PASSWORD=${HELPDESK_PASSWORD}
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      - MCP_TOKEN=${MCP_TOKEN}
      # Etapa 1: historial tambien en flx-mcp-memoria (Postgres). MEMORIA_LEER=1 lee de ahi; vacio, de los archivos.
      - MEMORIA_URL=${MEMORIA_URL}
      - MEMORIA_LEER=${MEMORIA_LEER}
      # Etapa 2: el Helpdesk se lee y se responde por flx-mcp-helpdesk (stack propio, red flx-agentes).
      - HELPDESK_MCP_URL=${HELPDESK_MCP_URL}
      # Servicios compartidos (obligatorios desde 1.2.0: ya no hay plugin embebido). Los clones de la API viven en flx-mcp-codigo.
      - CODIGO_MCP_URL=${CODIGO_MCP_URL}
      - DOCUMENTOS_MCP_URL=${DOCUMENTOS_MCP_URL}
      - RUNNER_URL=http://flx-agentes-runner_runner:3000
      - SAR_MCP_URL=http://flx-mcp-sar_mcp:8104/mcp
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      # Detras del portal flx-agentes-web: mismo PORTAL_SECRET que el portal. Vacio, la web sigue con su propio usuario.
      - PORTAL_SECRET=${PORTAL_SECRET}
      - AGENTE_URL=http://flx-agente-soporte-api_web:3000/mcp-agente
    # /data: clones de flxwebapi y flxwebapi-v2, historial compartido de analisis y config de Claude.
    # El volumen vive en el nodo de NODE: si el servicio cambia de nodo, el historial arranca vacio.
    # DATA_VOLUME=flx-integrador-web_data conserva el historial y los clones de antes del cambio de nombre.
    # Red interna de los agentes: aca estan flx-mcp-memoria y la base (sin puertos publicados).
    networks:
      - default
      - agentes
    volumes:
      - data:/data
    deploy:
      placement:
        constraints: ["${NODE}"]
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

volumes:
  data:
    name: "${DATA_VOLUME}"

networks:
  agentes:
    external: true
    name: flx-agentes
